name: branch-push

# Read-only, with no secrets. Actions are pinned to commit SHAs (a tag can be moved to other code); the comment names the
# version.

on:
    push:
        branches:
            - "**" # Match all branches
        paths-ignore:
            - "**.md"

permissions:
    contents: read

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            # Setup
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: "24"
                  registry-url: "https://registry.npmjs.org"

            - name: Reconfigure git
              run: |
                  git config user.email "builder@barchart.com"
                  git config user.name "Barchart Builder"

            # Yarn's version comes from packageManager in package.json
            - name: Enable Corepack
              run: corepack enable

            - name: Install dependencies
              run: |
                  yarn install --immutable
                  yarn generate:version

            - name: Lint
              run: yarn lint

            - name: Check formatting
              run: yarn format:check

            - name: Run tests
              run: yarn test

            - name: Build
              run: |
                  yarn build:ts
                  yarn build:node

            - name: Check the package
              run: |
                  yarn check:package
                  yarn check:esm
