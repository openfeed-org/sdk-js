name: build-and-release

# On each push to master, release-please keeps a release PR open: the next version, from the conventional commits since
# the last release, and their CHANGELOG.md entries. Merging it tags the release and creates the GitHub release; the
# build and publish jobs then publish that version to npm. They run here because a release created with GITHUB_TOKEN
# doesn't trigger other workflows.
#
# Building and publishing are separate jobs, so dependency code never runs where the npm credentials are: `build`
# installs, checks and packs without them; `publish` gets the credentials, and only stages that tarball, without
# checking out, installing or running scripts.
#
# The version is staged on npm, not published: it goes public once a maintainer approves it on npmjs.com (or with
# `npm stage approve`) with 2FA. npm's trusted publisher for this package should allow staging only.
#
# Actions are pinned to commit SHAs (a tag can be moved to other code); the comment names the version.
on:
    push:
        branches: [master]

permissions: {}

jobs:
    release-please:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
        outputs:
            release_created: ${{ steps.release.outputs.release_created }}
        steps:
            # release-please-config.json and .release-please-manifest.json
            - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
              id: release

    build:
        needs: release-please
        if: ${{ needs.release-please.outputs.release_created == 'true' }}
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: "24"

            # the proto dev dependency is installed over SSH from a private repository
            - name: Reconfigure git
              run: git config --global url.https://${{ secrets.API_TOKEN_GITHUB }}@github.com/.insteadOf ssh://git@github.com/

            - name: Build library
              run: |
                  yarn --frozen-lockfile
                  yarn build:ts
                  yarn build:node

            - name: Check the package
              run: |
                  yarn check:package
                  yarn check:esm

            - name: Pack
              run: mv "$(npm pack --ignore-scripts --silent)" package.tgz

            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: package
                  path: package.tgz
                  if-no-files-found: error
                  retention-days: 1

    publish:
        needs: build
        runs-on: ubuntu-latest
        permissions:
            id-token: write # npm trusted publishing (OIDC) and provenance
        steps:
            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: package
            # an exact Node version: its npm (11.19.1) has `npm stage`, which a runner's cached 24.x may not; trusted
            # publishing (OIDC) needs no token
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 24.22.1
                  registry-url: "https://registry.npmjs.org"

            # public, with provenance (publishConfig in the tarball's package.json)
            - name: Stage on npm
              run: npm stage publish package.tgz --ignore-scripts
